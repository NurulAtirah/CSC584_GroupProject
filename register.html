<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sukarelawan | Create Account</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e5631 0%, #a4de02 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .register-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 450px;
            text-align: center;
            margin: 20px;
        }
        h2 {
            color: #1e5631;
            margin-bottom: 3rem;
            font-size: 2.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #1e5631;
            box-shadow: 0 0 8px rgba(30, 86, 49, 0.2);
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-register:hover {
            background-color: #77bb02;
            transform: scale(1.02);
        }
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }
        .footer-text a {
            color: #008000;
            text-decoration: none;
            font-weight: bold;
        }
        .circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="circle" style="width: 250px; height: 250px; top: -50px; right: -50px;"></div>
    <div class="circle" style="width: 150px; height: 150px; bottom: 20px; left: 20px;"></div>

    <div class="register-container">
        <form action="RegisterServlet" method="POST">
            <h2>Register Account</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="username" name="fullName" required>
            </div>
            <div class="input-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" name="phoneNumber" required>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="role">Who are you?</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="student">I am a Student</option>
                    <option value="ngo">I am an NGO / Club Leader</option>
                </select>
            </div>

            <button type="submit" class="btn-register">Create Account</button>
            
            <p class="footer-text">
                Already have an account? <a href="index.html">Login here</a>
            </p>
        </form>
    </div>
</body>
</html>
