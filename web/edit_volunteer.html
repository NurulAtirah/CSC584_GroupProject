<!DOCTYPE html>
<html>
    <head>
        <title>Edit Volunteer Call</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Edit Volunteer Call</h1>
        
        <form action="volunteer_list.html">
            Title: <input type="text" name="title" value="Beach Cleaning Program"><br><br>
            Description:<br><textarea name="description" rows="4" cols="40">Cleaning activity at the beach.</textarea><br><br>
            Location:<input type="text" name="location" value="Port Dickson"><br><br>
            Date:<input type="date" name="date" value="2026-06-10"><br><br>
            Required Hours:<input type="number" name="hours" value="5"><br><br>
            <button type="submit">Update</button>
        </form>
        
        <br>
        <a href="volunteer_list.html">Cancel</a>
    </body>
</html>
