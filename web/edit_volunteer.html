<!DOCTYPE html>
<html>
<head>
    <title>Edit Volunteer Call</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right, #1b4332, #52b788);
            min-height:100vh;
        }

        .container{
            width:650px;
            background:#f4f7ef;
            margin:40px auto;
            padding:45px;
            border-radius:25px;
        }

        h1{
            text-align:center;
            color:#1b4332;
            font-size:38px;
        }

        label{
            font-weight:bold;
            color:#333;
        }

        input, textarea{
            width:100%;
            padding:14px;
            margin:10px 0 22px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            background:green;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        }

        .cancel{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#1b4332;
            font-weight:bold;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Edit Volunteer Call</h1>

    <form action="volunteer_list.html">
        <label>Title</label>
        <input type="text" value="Beach Cleaning Program">

        <label>Description</label>
        <textarea rows="5">Cleaning activity at the beach.</textarea>

        <label>Location</label>
        <input type="text" value="Port Dickson">

        <label>Date</label>
        <input type="date" value="2026-06-10">

        <label>Required Hours</label>
        <input type="number" value="5">

        <button type="submit">Update Volunteer Call</button>
    </form>

    <a href="volunteer_list.html" class="cancel">Cancel</a>
</div>

</body>
</html>
