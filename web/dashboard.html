<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right, #1b4332, #52b788);
            min-height:100vh;
        }

        .container{
            width:800px;
            background:#f4f7ef;
            margin:50px auto;
            padding:45px;
            border-radius:25px;
        }

        h1{
            text-align:center;
            color:#1b4332;
            font-size:40px;
        }

        .stats{
            display:flex;
            gap:20px;
            margin:30px 0;
        }

        .box{
            flex:1;
            background:white;
            padding:25px;
            border-radius:15px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#1b4332;
        }

        .menu a{
            display:block;
            background:green;
            color:white;
            padding:16px;
            text-decoration:none;
            text-align:center;
            border-radius:12px;
            margin:18px 0;
            font-weight:bold;
            font-size:18px;
        }

        .logout{
            background:#777 !important;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Club Leader Dashboard</h1>

    <div class="stats">
        <div class="box">
            Total Volunteer Calls<br>5
        </div>

        <div class="box">
            Total Students Joined<br>30
        </div>

        <div class="box">
            Total Community Hours<br>120
        </div>
    </div>

    <div class="menu">
        <a href="volunteer_list.html">Manage Volunteer Calls</a>
        <a href="login.html" class="logout">Logout</a>
    </div>
</div>

</body>
</html>
