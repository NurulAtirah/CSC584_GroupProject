<!DOCTYPE html>
<html>
<head>
    <title>Volunteer Call List</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right, #1b4332, #52b788);
            min-height:100vh;
        }

        .container{
            width:1000px;
            background:#f4f7ef;
            margin:50px auto;
            padding:40px;
            border-radius:25px;
        }

        h1{

            color:#1b4332;

        }

            text-decoration:none;
            border-radius:10px;
            font-weight:bold;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#1b4332;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            border:1px solid #ddd;
            text-align:center;
        }

        .edit{
            background:#2d6a4f;
            color:white;
            padding:10px 14px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
        }

        .delete{
            background:red;
            color:white;
            padding:10px 14px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
        }

        .back{
            display:inline-block;
            margin-top:25px;
            color:#1b4332;
            font-weight:bold;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="container">
