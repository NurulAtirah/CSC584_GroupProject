<!DOCTYPE html>
<html>
<head>
    <title>Delete Volunteer</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(to right, #1f5f2c, #9bd400);
            height:100vh;
        }

        .container{
            width:500px;
            background:#f4f7ef;
            margin:120px auto;
            padding:40px;
            border-radius:25px;
            text-align:center;
        }

        h1{
            color:#1f5f2c;
        }

        p{
            font-size:20px;
            color:#444;
        }

        .program{
            font-size:28px;
            font-weight:bold;
            margin:30px 0;
            color:#1f5f2c;
        }

        button{
            padding:15px 30px;
            border:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            margin:10px;
        }

        .deleteBtn{
            background:red;
            color:white;
        }

        .cancelBtn{
            background:gray;
            color:white;
            text-decoration:none;
            display:inline-block;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Delete Volunteer Call</h1>

    <p>Are you sure you want to delete this volunteer call?</p>

    <div class="program">
        Beach Cleaning Program
    </div>

    <button class="deleteBtn">
        Delete
    </button>

    <a href="volunteer_list.html" class="cancelBtn">
        Cancel
    </a>

</div>

</body>
</html>
